[package]
name = "pathtracer"
version = "0.1.0"
edition = "2024"
description = "A progressive, physically based path tracer with zero external dependencies"

# Intentionally empty: everything is implemented on top of `std`.
[dependencies]

# Lints are warnings here so a toolchain bump never breaks a plain `cargo build`;
# `cargo lint` (see .cargo/config.toml) and the pre-commit hook promote them to errors.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# Unsafe is confined to the platform FFI layer, which opts back in explicitly.
unsafe_code = "deny"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Numeric casts between pixel indices, sample counts and floats are pervasive and intentional
# in a renderer; flagging every one would bury the lints that matter.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Math code uses short conventional names (u, v, n, wi, wo, ...).
many_single_char_names = "allow"
similar_names = "allow"
# Hand-picked restriction lints.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Path tracing in an unoptimized build is painfully slow; keep dev builds usable.
[profile.dev]
opt-level = 2
