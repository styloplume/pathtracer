# Light types and many-light sampling.
#
# - A warm spot light (black-body colour temperature) and a cool point light.
# - Dim, slightly soft directional "moonlight".
# - 330 fairy-light bulbs (2640 emissive triangles) along the back wall. The light
#   BVH picks bulbs that are near and facing the shading point; compare with
#   `light_sampler = "power"` to see how much noisier power-proportional selection is.

[render]
width = 1280
height = 720
spp = 1024
max_depth = 8
noise_threshold = 0.02
light_sampler = "bvh"   # bvh (default) | power | uniform
exposure = 0.5

[camera]
position = [0, 1.6, 6.5]
look_at = [0, 1.1, 0]
fov = 40

[background]
color = [0.004, 0.005, 0.01]

# --- Lights -----------------------------------------------------------------------

[[lights]]
type = "spot"
position = [-2.5, 4.5, 3.0]
look_at = [-0.4, 0.4, 0]
angle = 22             # half angle of the cone, degrees
inner_angle = 15       # full intensity inside this half angle, smooth falloff outside
temperature = 3200     # black-body colour in Kelvin (multiplies `color`)
intensity = 60         # radiant intensity (or `power = ...`, the power of an isotropic source)

[[lights]]
type = "point"
position = [2.6, 2.2, 1.5]
color = [0.5, 0.7, 1.0]
power = 120

[[lights]]
type = "directional"
direction = [0.3, -1, -0.6]   # the direction the light travels (or elevation / azimuth)
color = [0.6, 0.7, 1.0]
intensity = 0.15       # irradiance on a surface facing the light
angle = 0.5            # angular diameter in degrees; 0 = perfectly sharp shadows

# --- Materials --------------------------------------------------------------------

[materials.floor]
type = "plastic"
color = [0.35, 0.3, 0.27]
roughness = 0.3

[materials.wall]
type = "diffuse"
albedo = [0.6, 0.58, 0.55]

[materials.bulb_warm]
type = "light"
temperature = 2700
intensity = 40

[materials.bulb_red]
type = "light"
emission = [1.0, 0.1, 0.05]
intensity = 30

[materials.bulb_green]
type = "light"
emission = [0.1, 1.0, 0.2]
intensity = 25

[materials.bulb_blue]
type = "light"
emission = [0.1, 0.3, 1.0]
intensity = 40

[materials.white]
type = "diffuse"
albedo = 0.8

[materials.brass]
type = "metal"
color = [0.9, 0.75, 0.45]
roughness = 0.25

[materials.glass]
type = "glass"
ior = 1.5

# --- Objects ----------------------------------------------------------------------

[[objects]]
type = "quad"
origin = [-8, 0, -3]
u = [16, 0, 0]
v = [0, 0, 12]
material = "floor"

[[objects]]   # back wall
type = "quad"
origin = [-8, 0, -3]
u = [0, 6, 0]
v = [16, 0, 0]
material = "wall"

[[objects]]
type = "mesh"
file = "models/fairy_lights.obj"   # groups map to the bulb_* materials above

[[objects]]
type = "sphere"
center = [-1.3, 0.6, 0]
radius = 0.6
material = "white"

[[objects]]
type = "sphere"
center = [0.2, 0.6, -0.4]
radius = 0.6
material = "brass"

[[objects]]
type = "sphere"
center = [1.5, 0.6, 0.3]
radius = 0.6
material = "glass"
