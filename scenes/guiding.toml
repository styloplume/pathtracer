# Path guiding: a room at night, lit indirectly by two uplights washing the ceiling.
#
# Almost everything is lit by two small, bright patches on the ceiling. Next-event
# estimation cannot aim at them (they are not lights), so plain path tracing finds them
# only by chance. With `guiding = true` the renderer learns, per region of space, which
# directions bring light (an SD-tree trained during the first `guiding_spp` samples per
# pixel) and sends half of its paths that way: here about 1.4x less variance at equal
# time (about 2x in a Cornell box lit by a narrow spot on its ceiling). Guiding pays off
# for strong indirect light; it costs ~20% more per sample, so leave it off for scenes
# lit mostly directly.

[render]
width = 1280
height = 720
spp = 2048
max_depth = 12
noise_threshold = 0.02
exposure = 0.5
guiding = true
guiding_spp = 128      # training budget; the distribution is frozen afterwards

[camera]
position = [2.3, 1.4, 2.4]
look_at = [-0.8, 0.9, -1.0]
fov = 62

[background]          # a dim night sky in the window
type = "gradient"
zenith = [0.004, 0.006, 0.015]
horizon = [0.01, 0.012, 0.02]
ground = [0.003, 0.003, 0.003]

[[lights]]            # uplight in the left corner
type = "spot"
position = [-2.6, 0.3, -2.6]
look_at = [-2.4, 3, -2.3]
angle = 7
inner_angle = 4
temperature = 2900
intensity = 220

[[lights]]            # uplight in the right corner
type = "spot"
position = [2.6, 0.3, -2.6]
look_at = [2.3, 3, -2.2]
angle = 7
inner_angle = 4
temperature = 3200
intensity = 220

[materials.wall]
type = "diffuse"
albedo = [0.75, 0.72, 0.68]

[materials.floor]
type = "plastic"
color = [0.45, 0.3, 0.2]
roughness = 0.4

[materials.sofa]
type = "diffuse"
albedo = [0.15, 0.3, 0.55]

[materials.glass]
type = "glass"
ior = 1.5

[materials.brass]
type = "metal"
preset = "gold"
roughness = 0.25

# --- Room: 6 x 3 x 6, a 1 x 1.2 window in the back (-z) wall ----------------------------

[[objects]]   # floor
type = "box"
min = [-3.2, -0.2, -3.2]
max = [3.2, 0, 3.2]
material = "floor"

[[objects]]   # ceiling
type = "box"
min = [-3.2, 3, -3.2]
max = [3.2, 3.2, 3.2]
material = "wall"

[[objects]]   # front wall
type = "box"
min = [-3.2, 0, 3]
max = [3.2, 3, 3.2]
material = "wall"

[[objects]]   # left wall
type = "box"
min = [-3.2, 0, -3]
max = [-3, 3, 3]
material = "wall"

[[objects]]   # right wall
type = "box"
min = [3, 0, -3]
max = [3.2, 3, 3]
material = "wall"

[[objects]]   # back wall, left of the window
type = "box"
min = [-3.2, 0, -3.2]
max = [-0.5, 3, -3]
material = "wall"

[[objects]]   # back wall, right of the window
type = "box"
min = [0.5, 0, -3.2]
max = [3.2, 3, -3]
material = "wall"

[[objects]]   # below the window
type = "box"
min = [-0.5, 0, -3.2]
max = [0.5, 1.2, -3]
material = "wall"

[[objects]]   # above the window
type = "box"
min = [-0.5, 2.4, -3.2]
max = [0.5, 3, -3]
material = "wall"

# --- Furniture --------------------------------------------------------------------------

[[objects]]   # sofa base
type = "box"
min = [-2.9, 0, -0.8]
max = [-2.0, 0.45, 1.4]
material = "sofa"

[[objects]]   # sofa back
type = "box"
min = [-3.0, 0, -0.8]
max = [-2.75, 0.95, 1.4]
material = "sofa"

[[objects]]   # glass ball
type = "sphere"
center = [0.35, 0.3, -1.2]
radius = 0.3
material = "glass"

[[objects]]
type = "cylinder"
base = [1.2, 0, -2.0]
height = 0.9
radius = 0.12
material = "brass"
