# Hypertexture (Perlin & Hoffert 1989): a soft object's density (1 deep inside, falling
# to 0 across its surface over `softness` units), modulated by noise and shaped by
# `bias` and `gain`:
#
#   density = gain(bias(clamp(D0 + amount * (noise - 0.5), 0, 1)))
#
# - Left: as a surface. The level set density = `level` is sphere traced (its Lipschitz
#   bound is estimated automatically). Turbulence erodes a sphere into pitted stone.
# - Right: as a volume. The same kind of density, with fBm, drives a heterogeneous
#   participating medium inside an invisible boundary (a cloud).
# - Centre: a torus whose ridged-multifractal hypertexture surface grows crests (gold).

[render]
width = 1280
height = 720
spp = 512
max_depth = 10
max_volume_depth = 64
noise_threshold = 0.02

[camera]
position = [0, 1.6, 6.0]
look_at = [0, 0.85, 0]
fov = 36

[background]
type = "sky"
sun_elevation = 30
sun_azimuth = -30
turbidity = 3
sun_size = 3

# --- Media ------------------------------------------------------------------------------

[media.cloud]
albedo = 0.95
density = 14        # extinction where the density is 1
g = 0.4
# Hypertexture densities are evaluated in world space: place the shape where the
# boundary object is.
field = { type = "hypertexture", shape = { type = "sphere", radius = 0.75, translate = [1.9, 1.0, -0.4] }, softness = 0.6, amount = 0.9, bias = 0.4, gain = 0.7, noise = { type = "fbm", scale = 2.5, octaves = 6 } }

# --- Materials --------------------------------------------------------------------------

[materials.floor]
type = "plastic"
color = 0.4
roughness = 0.5

[materials.stone]
type = "diffuse"
albedo = { type = "fbm", low = [0.5, 0.47, 0.42], high = [0.85, 0.82, 0.76], scale = 4 }

[materials.gold]
type = "metal"
preset = "gold"
roughness = 0.25

[materials.cloud_boundary]
type = "interface"
interior = "cloud"

# --- Objects ----------------------------------------------------------------------------

[[objects]]
type = "box"
min = [-80, -0.1, -80]
max = [80, 0, 80]
material = "floor"

[[objects]]   # eroded stone: turbulence carves pits and crevices into a soft sphere
type = "hypertexture"
translate = [-1.9, 0.85, -0.4]
material = "stone"
shape = { type = "sphere", radius = 0.7 }
softness = 0.35
noise = { type = "turbulence", scale = 2.5, octaves = 6 }
amount = 0.9
bias = 0.45
gain = 0.6
level = 0.5

[[objects]]   # crests on a torus
type = "hypertexture"
translate = [0, 0.75, 0.3]
rotate = [70, 0, 0]
material = "gold"
shape = { type = "torus", major = 0.6, minor = 0.2 }
softness = 0.3
noise = { type = "ridged", scale = 3, octaves = 5 }
amount = 0.8
level = 0.5

[[objects]]   # the cloud's boundary (holds the medium; the density fades out inside it)
type = "sphere"
center = [1.9, 1.0, -0.4]
radius = 1.35
material = "cloud_boundary"
