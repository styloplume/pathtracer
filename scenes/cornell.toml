# Cornell box: a closed room lit by a single area light.
# Units are arbitrary; the room spans x,z in [-1, 1] and y in [0, 2].

[render]
width = 800
height = 800
spp = 512              # samples per pixel (the maximum, with adaptive sampling)
max_depth = 10
initial_block = 32     # coarsest preview block size in pixels
exposure = 0.0         # stops
tonemap = "aces"       # none | reinhard | aces
filter = "gaussian"    # box | tent | gaussian | blackman-harris
# filter_radius = 1.5  # pixels (defaults: box 0.5, tent 1, gaussian / blackman-harris 1.5)
# noise_threshold = 0.02  # adaptive sampling: stop pixels below this noise level; 0 = off
# min_spp = 16         # samples before adaptive sampling may stop a pixel
# time_limit = 60      # seconds; 0 = no limit

[output]
formats = ["png"]      # any of png (tonemapped 8-bit), hdr (Radiance RGBE), pfm (float)
# path = "renders/{scene}_{time}"  # without extension; default: renders/{scene} headless,
                                   # renders/{scene}_{time} in the window
# save_on_finish = true  # window: save automatically whenever a render completes
# denoise = true         # also write <path>_denoised.<ext>
# aovs = ["albedo", "normal", "depth"]  # also write <path>_<aov>.<ext>

[camera]
position = [0, 1, 3.9]
look_at = [0, 1, 0]
fov = 38               # vertical, degrees

[background]
color = [0, 0, 0]

[materials.white]
type = "diffuse"
albedo = [0.73, 0.73, 0.73]

[materials.red]
type = "diffuse"
albedo = [0.65, 0.05, 0.05]

[materials.green]
type = "diffuse"
albedo = [0.12, 0.45, 0.15]

[materials.light]
type = "light"
emission = [17, 12, 4]
intensity = 1.0

[materials.gold]
type = "metal"
color = [1.0, 0.78, 0.34]
roughness = 0.3

[materials.glass]
type = "glass"
ior = 1.5

# --- Room ---------------------------------------------------------------------

[[objects]]   # floor
type = "quad"
origin = [-1, 0, -1]
u = [2, 0, 0]
v = [0, 0, 2]
material = "white"

[[objects]]   # ceiling
type = "quad"
origin = [-1, 2, -1]
u = [2, 0, 0]
v = [0, 0, 2]
material = "white"

[[objects]]   # back wall
type = "quad"
origin = [-1, 0, -1]
u = [2, 0, 0]
v = [0, 2, 0]
material = "white"

[[objects]]   # left wall
type = "quad"
origin = [-1, 0, -1]
u = [0, 0, 2]
v = [0, 2, 0]
material = "red"

[[objects]]   # right wall
type = "quad"
origin = [1, 0, -1]
u = [0, 0, 2]
v = [0, 2, 0]
material = "green"

[[objects]]   # ceiling light; one-sided lights emit along u x v (here: downwards)
type = "quad"
origin = [-0.25, 1.995, -0.2]
u = [0.5, 0, 0]
v = [0, 0, 0.4]
material = "light"

# --- Contents -----------------------------------------------------------------

[[objects]]   # tall box, loaded from an OBJ file
type = "mesh"
file = "models/box.obj"
material = "white"
scale = [0.6, 1.2, 0.6]
rotate = [0, 18, 0]    # degrees, applied X then Y then Z
translate = [-0.38, 0.6, -0.35]

[[objects]]
type = "sphere"
center = [0.5, 0.3, -0.45]
radius = 0.3
material = "gold"

[[objects]]
type = "sphere"
center = [0.3, 0.28, 0.45]
radius = 0.28
material = "glass"
