# Deterministic 3D fractals, ray traced by sphere tracing with distance estimators
# (Hart, Sandin & Kauffman 1989; Hart 1996).
#
# - Centre: a quaternion Julia set. The 4D set of q -> q^2 + c is cut by a 3D slice,
#   the hyperplane q . slice_normal = slice. With the default normal (the k axis) the
#   scene's x, y, z are the quaternion's real, i and j parts. c = -1 + 0.2i is a
#   "basilica" whose bulbs revolve around the real axis.
# - Left: the Mandelbulb (power 8).
# - Right: a Menger sponge (4 subdivisions).
#
# Fractal surfaces are as detailed as their hit tolerance `epsilon` (in object units;
# default 2e-4 of the object's size). Smaller values show finer detail but cost more steps.

[render]
width = 1280
height = 720
spp = 512
max_depth = 8
noise_threshold = 0.02

[camera]
position = [0, 1.7, 6.4]
look_at = [0, 0.95, 0]
fov = 36

[background]
type = "sky"
sun_elevation = 40
sun_azimuth = 35
turbidity = 2.5
sun_size = 3

[materials.floor]
type = "plastic"
color = { type = "checker", even = 0.6, odd = 0.45, scale = 1, space = "world" }
roughness = 0.3

[materials.julia]
type = "plastic"
roughness = 0.2
# Solid texture in the fractal's own (object) space.
color = { type = "fbm", low = [0.9, 0.45, 0.12], high = [0.95, 0.85, 0.5], scale = 3, octaves = 3 }

[materials.bulb]
type = "principled"
base_color = [0.2, 0.45, 0.8]
metallic = 0.6
roughness = 0.3

[materials.sponge]
type = "diffuse"
albedo = [0.85, 0.84, 0.8]

[[objects]]
type = "box"
min = [-80, -0.1, -80]
max = [80, 0, 80]
material = "floor"

[[objects]]
type = "julia"
c = [-1, 0.2, 0, 0]           # (real, i, j, k)
iterations = 10
slice = 0.0
slice_normal = [0, 0, 0, 1]   # (real, i, j, k): the k = slice hyperplane
translate = [0, 0.95, 0.3]
rotate = [0, 15, 20]
scale = 0.75
material = "julia"

[[objects]]
type = "mandelbulb"
power = 8
iterations = 10
translate = [-2.2, 0.75, -0.6]
scale = 0.7
rotate = [0, 30, 0]
material = "bulb"

[[objects]]
type = "menger"
iterations = 4
translate = [2.2, 0.6, -0.6]
scale = 0.6
rotate = [0, -25, 0]
material = "sponge"
