# Implicit surfaces: signed distance fields ray traced by sphere tracing, with smooth CSG,
# noise displacement, fractal bump mapping and solid textures. None of these objects has
# UV coordinates.
#
# - Back left: a machined part. A rounded box, smoothly united with a torus, with a
#   sphere and a cylinder cut away (smooth difference), in marble.
# - Back right: a ridged-multifractal rock (the noise displaces the surface; the
#   Lipschitz bound for safe steps is estimated automatically).
# - Front: blobs (smooth union of spheres) in glass, a wooden torus, and a capsule with a
#   domain-warped ridged bump.
# - The floor's bump is a ridged multifractal too. Its octaves fade with distance
#   (clamped by the ray footprint), so the far floor stays smooth instead of aliasing.

include = "lib/materials.toml"

[render]
width = 1280
height = 720
spp = 512
max_depth = 12
noise_threshold = 0.02

[camera]
position = [0, 2.2, 6.2]
look_at = [0, 0.7, 0]
fov = 38

[background]
type = "sky"
sun_elevation = 35
sun_azimuth = -40
turbidity = 3
sun_size = 4

# --- Materials --------------------------------------------------------------------------

[materials.floor]
type = "plastic"
roughness = 0.4
# A solid pattern: no UVs, evaluated at the world-space position.
color = { type = "terrain", low = [0.32, 0.3, 0.27], high = [0.62, 0.58, 0.52], scale = 0.8, octaves = 6 }
# Bump from the noise gradient (analytic, no finite differences, no UVs).
bump = { type = "ridged", scale = 3, octaves = 8 }
bump_scale = 0.008

[materials.machined_marble]
type = "plastic"
roughness = 0.08
color = { type = "marble", low = [0.9, 0.89, 0.86], high = [0.42, 0.44, 0.48], scale = 5, octaves = 6, amount = 2.5 }

[materials.rock]
type = "diffuse"
albedo = { type = "fbm", low = [0.25, 0.22, 0.2], high = [0.55, 0.5, 0.45], scale = 3, octaves = 5 }
bump = { type = "fbm", scale = 12, octaves = 6 }
bump_scale = 0.01

[materials.oak]
type = "plastic"
roughness = 0.3
color = { type = "wood", low = [0.55, 0.35, 0.18], high = [0.3, 0.17, 0.08], scale = 12, amount = 0.6, octaves = 4 }

[materials.warped_copper]
type = "metal"
preset = "copper"
roughness = 0.25
bump = { type = "ridged", scale = 6, octaves = 5, warp = 0.6 }
bump_scale = 0.015

# --- Objects ----------------------------------------------------------------------------

[[objects]]
type = "box"
min = [-80, -0.1, -80]
max = [80, 0, 80]
material = "floor"

[[objects]]   # the machined part
type = "sdf"
translate = [-1.35, 0.62, -0.6]
rotate = [0, 30, 0]
material = "machined_marble"
sdf = { type = "difference", blend = 0.04, children = [
    { type = "union", blend = 0.15, children = [
        { type = "box", size = [1.1, 0.7, 1.1], round = 0.08 },
        { type = "torus", major = 0.62, minor = 0.12, translate = [0, -0.1, 0] },
    ] },
    { type = "sphere", radius = 0.45, translate = [0, 0.45, 0] },
    { type = "cylinder", radius = 0.16, height = 2, rotate = [90, 0, 0] },
] }

[[objects]]   # the rock: a sphere displaced by a ridged multifractal
type = "sdf"
translate = [1.45, 0.7, -0.7]
material = "rock"
sdf = { type = "displace", amount = 0.35, noise = { type = "ridged", scale = 1.6, octaves = 5 }, child = {
    type = "sphere", radius = 0.72, scale = [1, 0.85, 1] } }

[[objects]]   # glass blobs: a smooth union of spheres
type = "sdf"
translate = [-0.25, 0.42, 1.1]
material = "glass"
sdf = { type = "union", blend = 0.3, children = [
    { type = "sphere", radius = 0.32 },
    { type = "sphere", radius = 0.22, translate = [0.38, 0.12, 0.1] },
    { type = "sphere", radius = 0.18, translate = [-0.3, 0.2, -0.15] },
    { type = "sphere", radius = 0.14, translate = [0.05, 0.4, 0.05] },
] }

[[objects]]   # a wooden ring lying on the floor
type = "sdf"
translate = [1.05, 0.13, 1.05]
material = "oak"
sdf = { type = "torus", major = 0.38, minor = 0.13 }

[[objects]]   # a copper capsule with a domain-warped bump
type = "sdf"
translate = [0.15, 0.95, -1.3]
rotate = [0, 0, 70]
material = "warped_copper"
sdf = { type = "capsule", a = [0, -0.55, 0], b = [0, 0.55, 0], radius = 0.28 }
