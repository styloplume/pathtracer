# Reusable material library. Pull it into a scene with
#
#   include = "lib/materials.toml"      # path relative to the including file
#
# A scene can override any material by defining one with the same name; texture paths
# in here stay relative to this file.

# --- Neutrals -----------------------------------------------------------------

[materials.white]
type = "diffuse"
albedo = 0.8

[materials.gray]
type = "diffuse"
albedo = 0.4

[materials.charcoal]
type = "diffuse"
albedo = 0.04

[materials.matte_black]
type = "plastic"
color = 0.02
roughness = 0.5

# --- Plastics and paints ------------------------------------------------------

[materials.red_plastic]
type = "plastic"
color = [0.7, 0.06, 0.04]
roughness = 0.15

[materials.blue_plastic]
type = "plastic"
color = [0.05, 0.15, 0.6]
roughness = 0.25

[materials.rubber]
type = "plastic"
color = [0.05, 0.05, 0.05]
roughness = 0.7

[materials.car_paint]
type = "principled"
base_color = [0.05, 0.25, 0.12]
metallic = 0.6
roughness = 0.35
clearcoat = 1.0

# --- Metals -------------------------------------------------------------------

[materials.gold]
type = "metal"
preset = "gold"
roughness = 0.15

[materials.silver]
type = "metal"
preset = "silver"
roughness = 0.05

[materials.copper]
type = "metal"
preset = "copper"
roughness = 0.25

[materials.brushed_aluminium]
type = "metal"
preset = "aluminium"
roughness = 0.35

[materials.chrome]
type = "metal"
preset = "chromium"
roughness = 0.02

# --- Dielectrics --------------------------------------------------------------

[materials.glass]
type = "glass"
ior = 1.5

[materials.frosted_glass]
type = "glass"
ior = 1.5
roughness = 0.3

[materials.amber_glass]
type = "glass"
ior = 1.52
color = [0.95, 0.6, 0.2]   # transmittance after 'distance'
distance = 0.5

# --- Natural ------------------------------------------------------------------

[materials.wood]
type = "plastic"
color = { type = "turbulence", low = [0.35, 0.2, 0.1], high = [0.6, 0.38, 0.2], scale = 6, octaves = 4 }
roughness = 0.4

[materials.marble]
type = "plastic"
color = { type = "noise", low = [0.55, 0.55, 0.58], high = [0.95, 0.94, 0.92], scale = 3, octaves = 6 }
roughness = 0.05

[materials.bark]
type = "diffuse"
albedo = [0.22, 0.14, 0.08]

[materials.leaves]
type = "diffuse"
albedo = [0.08, 0.3, 0.07]

[materials.grass]
type = "diffuse"
albedo = { type = "noise", low = [0.12, 0.25, 0.06], high = [0.25, 0.4, 0.1], scale = 0.5 }

# --- Lights -------------------------------------------------------------------

[materials.warm_light]
type = "light"
temperature = 3200
intensity = 8

[materials.daylight_panel]
type = "light"
temperature = 6500
intensity = 8
